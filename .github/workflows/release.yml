name: Release extension package

on:
  push:
    tags: ['v*']

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: $/.github/workflows/release-build.yml

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: cleisson-labs/.github/.github/workflows/release.yml@03f53ed9e71b2741c683c448a538f7a7b8aa1786 # v1.0.0
    with:
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      title: ${{ github.ref_name }}
      notes: ${{ fromJSON(needs.build.outputs.notes) }}
      generate-notes: true
